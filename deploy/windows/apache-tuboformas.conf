# Sitio del sistema Tuboformas. instalar.ps1 lo copia a C:\laragon\etc\apache2\sites-enabled\00-0-tuboformas.conf
# (el nombre "00-0" lo carga antes que 00-default.conf de Laragon: así es el sitio por defecto y responde a la IP fija y a tuboformas.local).
# __PUBLICO__ lo reemplaza el script por la carpeta public del proyecto.

<VirtualHost *:80>
    ServerName tuboformas.local
    ServerAlias *
    DocumentRoot "__PUBLICO__"
    # Sin esto, si Laragon nunca se abrió, "/" busca solo index.html y Apache responde 403.
    DirectoryIndex index.php index.html

    <Directory "__PUBLICO__">
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Fotos de celular y manuales en PDF.
    LimitRequestBody 52428800

    # Los registros rotan solos: las pantallas en vivo consultan cada 30 s y sin esto el archivo
    # crecería varios GB al año. Se guardan 5 archivos de 10 MB.
    ErrorLog "|bin/rotatelogs.exe -n 5 logs/tuboformas-error.log 10M"
    CustomLog "|bin/rotatelogs.exe -n 5 logs/tuboformas-acceso.log 10M" common

    # Menos datos por el WiFi: texto comprimido y diseño/íconos en caché del celular
    # (solo public/build: cada archivo lleva su versión en el nombre).
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript application/json image/svg+xml application/manifest+json
    </IfModule>
    <IfModule mod_headers.c>
        <LocationMatch "^/build/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>
    </IfModule>
</VirtualHost>
